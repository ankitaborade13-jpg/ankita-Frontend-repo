<!-- ex 5 -->
 <!DOCTYPE html>
<html>
<head>

</head>
<body>
    <h1> Student Information</h1>
    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>Age:</label>
        <input type="number">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">
        <label>Male:</label>

        <input type="radio" name="gender" value="Female"> 
           <label>Female:</label>
      
        <input type="radio" name="gender" value="Other"> 
          <label>Other:</label>
        <br><br>

        <label>Programming Skills:</label>
        <input type="checkbox" id="html" value="HTML">
        <label >HTML</label>

        <input type="checkbox" id="css" value="CSS">
        <label >CSS</label>

        <input type="checkbox" id="java" value="Java">
        <label >Java</label> 
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>

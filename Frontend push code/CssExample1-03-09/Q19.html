<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue;
            text-align: center;
            font-size: 32px;
        }

        .form-box {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid darkblue;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: navy; font-size: 36px; text-align: center;">
        Student Registration Form
    </h1>

    <div class="form-box">

        <form>

            <label>Name:</label>
            <input type="text" name="name">

            <br><br>

            <label>Email:</label>
            <input type="email" name="email">

            <br><br>

            <label>Mobile:</label>
            <input type="tel" name="mobile">

            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female

            <br><br>

            <label>Course:</label>
            <select>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>MCA</option>
                <option>MBA</option>
            </select>

            <br><br>

            <label>Address:</label>
            <textarea rows="4" cols="30"></textarea>

            <br><br>

            <!-- Inline CSS -->
            <input type="submit"
                   value="Register"
                   style="background-color: green;
                          color: white;
                          font-weight: bold;
                          padding: 10px 20px;
                          border: 2px solid darkgreen;">
        </form>

    </div>

</body>
</html>

<!-- ex 6 -->
 <!DOCTYPE html>
<html>
<head>
    <title>Font Weight</title>
    <style>
        h1 {
            font-weight: bold;
        }
        .p1 {
            font-weight: normal;
        }
        .p2 {
            font-weight: lighter;
        }
        .p3 {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Bold Heading</h1>
    <p class="p1">This paragraph has normal weight.</p>
    <p class="p2">This paragraph is lighter.</p>
    <p class="p3">This paragraph has 600 font weight.</p>
</body>
</html>
